server.port=8080
# В продакшене обязательно TLS: server.ssl.enabled=true + сертификат (wss://)

# Домен сервиса (используется для OAuth redirect_uri: <domain>/callback и <domain>/spoti_callback).
# Домен старого сервера: у OAuth-приложений Яндекса/Spotify уже зарегистрированы
# redirect URI на alice-lms.zeabur.app, поэтому Яндекс и Spotify ничего не заметят.
# В Zeabur перекрывается env-переменной DOMAIN
domain=https://alice-lms.zeabur.app

# СЕКРЕТЫ ЗДЕСЬ НЕ ХРАНИМ! Все значения задаются env-переменными (Zeabur / запуск).
# Локальный запуск: export YANDEX_CLIENT_ID=... YANDEX_CLIENT_SECRET=... и т.д.
yandex.client-id=${YANDEX_CLIENT_ID:}
yandex.client-secret=${YANDEX_CLIENT_SECRET:}

spotify.client-id=${SPOTIFY_CLIENT_ID:}
spotify.client-secret=${SPOTIFY_CLIENT_SECRET:}

info.skill-id=${SKILL_ID:}
info.skill-dev-token=${SKILL_DEV_TOKEN:}
info.tts-api-key=${TTS_API_KEY:}
